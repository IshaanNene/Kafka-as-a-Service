version: "3"

vars:
  KIND_CLUSTER: kaas-dev
  STRIMZI_VERSION: 1.0.1

tasks:
  default:
    cmds: [task --list]

  build:
    desc: Build the kaas binary into ./bin
    cmds:
      - go build -o bin/kaas ./cmd/kaas

  test:
    desc: Unit, property and kfake tests
    cmds:
      - go test -race ./...

  test:web:
    desc: The console's JavaScript tests (needs Node 20+; the Go build does not)
    cmds:
      - node --test controlplane/console/webtest/*.test.mjs

  console:
    desc: The web console on a made-up fleet of four clusters, at http://127.0.0.1:7070
    cmds:
      - go run ./cmd/kaas console --demo --allow-apply --web-dir controlplane/console/web

  test:integration:
    desc: Testcontainers tests (needs Docker). Set KAAS_KAFKA_IMAGE to pick a version.
    cmds:
      - go test -race -tags integration ./...

  test:chaos:
    desc: Chaos tests on a real broker (needs Docker) — the broker paused mid-send, latency, rebalances
    cmds:
      - go test -race -tags chaos -run Chaos -v ./core/pipe

  test:fuzz:
    desc: Fuzz every parser for FUZZTIME each (default 30s)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - for: ["core/logmap FuzzParseBatches", "core/sniff FuzzBatchFields", "core/sniff FuzzSkipTags", "core/configs FuzzParseFile", "core/produce FuzzParseLine", "core/pipe FuzzDecodeJSONL", "core/pipe FuzzCSVValues", "core/pipe FuzzFilter"]
        cmd: set -- {{.ITEM}}; go test ./$1 -run '^$' -fuzz "^$2\$" -fuzztime {{.FUZZTIME}}

  test:soak:
    desc: Run pipes against a real broker for KAAS_SOAK_DURATION (default 2m) and write soak.md
    cmds:
      - KAAS_SOAK_REPORT="$PWD/soak.md" go test -tags soak -v -timeout 4h ./test/soak

  bench:
    desc: Benchmarks for the pipe and the engine
    cmds:
      - go test -run '^$' -bench . -benchmem ./core/pipe ./core/engine

  lint:
    desc: golangci-lint, including the core/ import boundary
    cmds:
      - golangci-lint run ./...

  screenshots:
    desc: Regenerate docs/img by driving every screen against an in-memory cluster
    cmds:
      - go test ./cmd/kaas -run TestScreenshots -count=1 -shots "$PWD/docs/img"

  asciipack:
    desc: Re-bake ascii-magic frame packs into ui/asciipack/packs (needs Node; the Go build does not)
    dir: tools/asciipack
    cmds:
      - npm ci --ignore-scripts --no-audit --no-fund
      - node bake.mjs ../../ui/asciipack/packs {{.CLI_ARGS}}

  vuln:
    desc: govulncheck
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:snapshot:
    desc: Local GoReleaser dry run (no signing, no publish)
    cmds:
      - goreleaser release --snapshot --clean --skip=sign,sbom

  dev:
    desc: Local stack on kind — Strimzi operator plus a 3-broker KRaft cluster
    cmds:
      - kind get clusters | grep -qx {{.KIND_CLUSTER}} || kind create cluster --name {{.KIND_CLUSTER}} --config deploy/kind/kind-config.yaml
      - kubectl create namespace kafka --dry-run=client -o yaml | kubectl apply -f -
      # The release manifest binds the operator's service account in namespace
      # "myproject"; rewrite it or the operator gets 403s on every call.
      - >-
        curl -fsSL "https://github.com/strimzi/strimzi-kafka-operator/releases/download/{{.STRIMZI_VERSION}}/strimzi-cluster-operator-{{.STRIMZI_VERSION}}.yaml"
        | sed 's/namespace: myproject/namespace: kafka/'
        | kubectl apply -n kafka -f -
      - kubectl -n kafka rollout status deploy/strimzi-cluster-operator --timeout=5m
      - kubectl apply -n kafka -f deploy/kind/kafka.yaml
      - kubectl -n kafka wait kafka/dev --for=condition=Ready --timeout=10m
      - echo "Kafka ready. Run 'task dev:forward' then 'kaas snapshot -b localhost:9092'."

  dev:forward:
    desc: Port-forward the dev cluster's bootstrap to localhost:9092
    cmds:
      - kubectl -n kafka port-forward svc/dev-kafka-bootstrap 9092:9092

  dev:down:
    desc: Delete the kind cluster
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER}}
