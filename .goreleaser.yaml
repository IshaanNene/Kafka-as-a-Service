version: 2
project_name: kaas

builds:
  - id: kaas
    main: ./cmd/kaas
    binary: kaas
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/IshaanNene/Kafka-as-a-Service/internal/version.Version={{ .Version }}
      - -X github.com/IshaanNene/Kafka-as-a-Service/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/IshaanNene/Kafka-as-a-Service/internal/version.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

# The image deploy/operator/operator.yaml runs. latest follows releases,
# not pre-releases.
dockers_v2:
  - id: kaas
    ids: [kaas]
    dockerfile: Dockerfile.release
    images: [ghcr.io/ishaannene/kaas]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/IshaanNene/Kafka-as-a-Service
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

docker_signs:
  - artifacts: manifests
    cmd: cosign
    args: [sign, "${artifact}@${digest}", --yes]

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
