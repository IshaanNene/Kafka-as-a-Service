version: 2
project_name: kaas

builds:
  - id: kaas
    main: ./cmd/kaas
    binary: kaas
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/IshaanNene/Kafka-as-a-Service/internal/version.Version={{ .Version }}
      - -X github.com/IshaanNene/Kafka-as-a-Service/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/IshaanNene/Kafka-as-a-Service/internal/version.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
